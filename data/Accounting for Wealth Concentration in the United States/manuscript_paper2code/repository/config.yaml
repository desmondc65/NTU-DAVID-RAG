## config.yaml
demographics:
  periods: 16 # 5-year periods (ages 20-99)
  retirement_period: 10 # Age 65
  annual_to_period_factor: 5

preferences:
  sigma_c: 1.5 # Inverse elasticity of intertemporal substitution
  sigma_l: 1.22 # Inverse elasticity of labor supply (Frisch = 0.82)
  theta: 0.0 # Disutility of work (to be calibrated to match hours=0.35)
  beta: 0.88 # Discount factor (0.974 per annum)

production:
  alpha: 0.33 # Capital share (approximate, adjusted to net labor share)
  delta_annual: 0.045 # Annual depreciation rate
  psi: 1.55 # Total factor productivity (normalized for w=1)

productivity:
  ordinary_states: 6
  extraordinary_states: 2
  ar1_persistence_annual: 0.97
  sigma_a_sq_ratio: 0.4 # Transitory variance share
  sigma_sq: 0.81 # Total variance of productivity
  zeta: 0.18 # Initial distribution parameter

returns:
  states: 3 # Low, High, Top
  initial_r: 0.045 # Aggregate interest rate target

taxes:
  tau_s: 0.05 # Sales tax
  tau_c: 0.236 # Corporate tax rate
  corp_tax_revenue_target: 0.025 # 2.5% of GDP
  max_marginal_income_tax: 0.396
  estate_tax_rate: 0.20
  estate_tax_threshold: 0.02 # Top 2% of estates

bequests:
  sigma_b: 0.0 # Curvature (to be calibrated)
  phi1: 0.0 # Altruism (to be calibrated)
  phi2: 0.0 # Non-homotheticity (to be calibrated)

computation:
  asset_grid_size: 500
  asset_min: 0.0
  asset_max: 5000.0 # Large enough for top 0.1%
  tolerance: 1e-6
  max_iter: 1000