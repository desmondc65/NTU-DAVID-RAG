## config.yaml
# Demographics
age:
  start: 21
  end: 100
  retirement: 66
  total_periods: 80

# Preference Parameters
preferences:
  gamma: 2.0           # Coefficient of relative risk aversion
  alpha: 0.6530        # Share of consumption in utility
  lambda_joint: 0.6    # Degree of joint consumption for married couples
  frisch_elasticity: 0.5
  discount_factor: 0.9827 # Unadjusted beta

# Production Technology
production:
  theta: 0.375         # Capital share
  delta: 0.075         # Depreciation rate
  mu: 0.015            # Labor-augmenting productivity growth
  nu: 0.009            # Population growth rate
  A_target: 0.8885     # TFP scalar

# Earning Process (AR1)
earning_process:
  rho: 0.87            # Persistence
  sigma: 0.39          # Std dev of shock
  wage_corr_married: 0.29 # Intrafamily correlation parameter omega
  nodes_e: 5           # Earning ability nodes

# State Space Discretization
grid_sizes:
  a: 27                # Wealth nodes
  b: 15                # Historical earning nodes (AIME)
  e: 5                 # Earning shock nodes

# Government Policy (Baseline 2013)
policy:
  tau_p: 0.1007        # OASI payroll tax rate
  income_tax:
    phi_t: 0.3454      # Limit of tax rate
    phi_m1: 0.0        # Estimated params for married/single (placeholder)
    phi_m2: 0.0
  standard_deduction: 0.1 # Sum of deduction and exemptions per adult
  oasi_brackets: [0.90, 0.32, 0.15]
  oasi_thresholds: [0.15, 0.90] # Normalized bend points

# Numerical Settings
solver:
  damping_factor: 0.2  # For K/L price updates
  tolerance: 1e-4
  max_iter: 500
  transition_years: 100