## config.yaml
economy:
  capital_share: 0.36
  annual_depreciation: 0.08
  model_period_years: 5
  government_exp_ratio: 0.17  # g/Y in benchmark
  target_annual_interest_rate: 0.041

household:
  risk_averison: 2.0
  labor_disutility_scale: 0.358 # theta (calibrated)
  labor_supply_curvature: 1.183 # epsilon (calibrated)
  annual_discount_factor: 0.962 # beta (calibrated)
  borrowing_constraint: 0.0

productivity:
  prob_death: 0.2  # mu (25-year generation)
  prob_newborn_low_skill: 0.9 # pi
  f_states: [-0.40, 0.55]
  a_states: [-0.37, 0.33]
  intergen_transition:
    - [0.69, 0.31]
    - [0.43, 0.57]
  lifecycle_transition_annual:
    - [0.68, 0.32]
    - [0.28, 0.72]

tax_policy:
  benchmark_tau: 0.17
  optimal_ss_tau: -0.09

numerical:
  k_min: 0.0
  k_max: 3000.0
  k_size: 200
  tol_ss: 1e-6
  tol_path: 1e-4
  max_iter: 1000
  damping: 0.2
  transition_horizon: 30 # Periods (150 years)