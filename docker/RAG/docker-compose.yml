services:
  rag-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-web
    restart: unless-stopped
    ports:
      - "${RAG_PORT:-3006}:5000"
    env_file:
      - .env
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      RAG_DEVICE: "cuda:0"
      RAG_EMBEDDING_DEVICE: "cuda:0"
      RAG_RERANKER_DEVICE: "cuda:0"
    volumes:
      # Mount the project source so orchestrator imports work
      - ../../utils:/app/utils:ro
      - ../../db:/app/db
      - ../../data:/app/data
      # Mount the requirements of the project
      - ../../requirements.txt:/app/project_requirements.txt:ro
      # Persist container stdout/stderr to host log file
      - ./log.txt:/app/log.txt
    command: >
      /bin/sh -c "gunicorn --bind 0.0.0.0:5000 --timeout 600 --workers 1 --threads 4 app:app 2>&1 | tee -a /app/log.txt"
    gpus: all
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - rag-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rag-web-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-web-dev
    profiles: ["dev"]
    ports:
      - "${RAG_PORT:-3006}:5000"
    env_file:
      - .env
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: "0"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      RAG_DEVICE: "cuda:0"
      RAG_EMBEDDING_DEVICE: "cuda:0"
      RAG_RERANKER_DEVICE: "cuda:0"
    volumes:
      - ./app.py:/app/app.py
      - ../../utils:/app/utils:ro
      - ../../db:/app/db
      - ../../data:/app/data
      - ../../requirements.txt:/app/project_requirements.txt:ro
      - ./log.txt:/app/log.txt
    command: >
      /bin/sh -c "python app.py 2>&1 | tee -a /app/log.txt"
    gpus: all
    privileged: true
    networks:
      - rag-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  rag-frontend-dev:
    image: node:20-slim
    container_name: rag-frontend-dev
    profiles: ["dev"]
    working_dir: /frontend
    depends_on:
      - rag-web-dev
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://rag-web-dev:5000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/frontend
    command: >
      /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - rag-net

networks:
  rag-net:
    driver: bridge
