# Unified RAG stack
# -----------------------------------------------------------------------------
# One embedding-server container owns the GPU and hosts the gte-Qwen2-7B
# embedder + bge-reranker-v2-m3 once. rag-web is a CPU-only Flask backend
# that delegates all embedding / reranking over HTTP.
#
# An nginx proxy exposes the service under a single external port:
#   http://<host>:${UNIFIED_PORT:-3006}/            → vector RAG UI
#
# Database layout:
#   rag-web       → ../db        +  ../data
#
# The per-service compose file in RAG/ is still usable for running the
# service in isolation; it loads its own embedder and does not share
# this stack.
services:

  auth-db:
    image: postgres:16-alpine
    container_name: auth-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${AUTH_DB_NAME:-appdb}
      POSTGRES_USER: ${AUTH_DB_USER:-appuser}
      POSTGRES_PASSWORD: ${AUTH_DB_PASSWORD:?AUTH_DB_PASSWORD is required}
    volumes:
      - ../auth_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - shared-net

  embedding-server:
    build:
      context: ./embedding_server
      dockerfile: Dockerfile
    container_name: embedding-server
    restart: unless-stopped
    environment:
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      # Single GPU: gte-Qwen2-7B's custom modeling code breaks under
      # accelerate multi-GPU sharding (cross-device tensor errors in its
      # custom RMSNorm), so pin to one GPU and rely on fp16 to fit.
      CUDA_VISIBLE_DEVICES: "${EMBEDDING_GPU:-1}"
      EMBEDDING_DEVICE: "cuda:0"
      RERANKER_DEVICE: "cuda:0"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-Alibaba-NLP/gte-Qwen2-7B-instruct}"
      RERANKER_MODEL: "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-8}"
    volumes:
      # server.py imports utils.s2_embedding.embedder for prefix helpers.
      - ../utils:/app/utils:ro
      # Persist HF weights so subsequent restarts don't re-download.
      - ../hf_cache:/root/.cache/huggingface
    healthcheck:
      # Needs both models loaded before dependents can start. On a cold
      # HF cache the 7B download can take several minutes — start_period
      # gives a long grace window where failures don't count.
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; d=json.loads(urllib.request.urlopen('http://localhost:8080/health',timeout=5).read()); sys.exit(0 if d.get('embedder_ready') and d.get('reranker_ready') else 1)"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${EMBEDDING_GPU:-1}"]
              capabilities: [gpu]
    networks:
      - shared-net

  rag-web:
    build:
      context: ./RAG
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: "/rag/"
    container_name: rag-web
    restart: unless-stopped
    depends_on:
      embedding-server:
        condition: service_healthy
      auth-db:
        condition: service_healthy
    env_file:
      - ./RAG/.env
    environment:
      # Remote-mode: both wrappers skip local model loads and route to the
      # shared embedding server. Retrieval/query is CPU-only here; the GPU
      # is only touched transiently by MinerU during PDF ingestion.
      RAG_EMBEDDING_SERVER_URL: "http://embedding-server:8080"
      RAG_RERANKER_SERVER_URL: "http://embedding-server:8080"
      # Identity of the embedder the server loaded. The backend uses it to
      # select this model's Qdrant collections — vectors from different
      # embedders live in separate collections, so this MUST match the
      # embedding-server's EMBEDDING_MODEL above.
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-Alibaba-NLP/gte-Qwen2-7B-instruct}"
      RAG_DEVICE: "cpu"
      RAG_EMBEDDING_DEVICE: "cpu"
      RAG_RERANKER_DEVICE: "cpu"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      # MinerU (PDF layout/OCR) runs here during ingestion. Kept separate
      # from EMBEDDING_GPU so MinerU can be moved off the embedder's card
      # when that card is full.
      CUDA_VISIBLE_DEVICES: "${RAG_WEB_GPU:-${EMBEDDING_GPU:-1}}"
      # Cap MinerU's auto-tuned batch size — its default reads the device's
      # TOTAL vram and picks ratio=16 for any ≥32 GB card, which OOMs on a
      # shared GPU. 8 keeps a comfortable ~5 GB working set.
      MINERU_HYBRID_BATCH_RATIO: "${MINERU_HYBRID_BATCH_RATIO:-8}"
      # Reduce fragmentation under tight memory.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
      # Auth — rag-web owns Alembic migrations for the whole stack.
      AUTH_DB_URL: "postgresql+psycopg://${AUTH_DB_USER:-appuser}:${AUTH_DB_PASSWORD}@auth-db:5432/${AUTH_DB_NAME:-appdb}"
      SESSION_SECRET: "${SESSION_SECRET}"
      SESSION_COOKIE_SECURE: "${SESSION_COOKIE_SECURE:-false}"
      ALLOW_REGISTRATION: "${ALLOW_REGISTRATION:-true}"
      APP_SCOPE: "rag"
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ../utils:/app/utils:ro
      - ../db:/app/db
      - ../data:/app/data
      - ../requirements.txt:/app/project_requirements.txt:ro
      - ./RAG/log.txt:/app/log.txt
      # Share the HF cache so MinerU's layout models are fetched once.
      - ../hf_cache:/root/.cache/huggingface
    command: >
      /bin/sh -c "alembic -c utils/auth/alembic.ini upgrade head &&
                  gunicorn --bind 0.0.0.0:5000 --timeout 3600 --workers 1 --threads 4 app:app 2>&1 | tee -a /app/log.txt"
    privileged: true
    deploy:
      # MinerU runs only during uploads and releases memory when done.
      # Defaults to the embedder's GPU but can be split via RAG_WEB_GPU
      # when that card is already saturated.
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${RAG_WEB_GPU:-${EMBEDDING_GPU:-1}}"]
              capabilities: [gpu]
    networks:
      - shared-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  proxy:
    image: nginx:1.27-alpine
    container_name: rag-proxy
    restart: unless-stopped
    depends_on:
      - rag-web
    ports:
      - "${UNIFIED_PORT:-3006}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - shared-net

networks:
  shared-net:
    driver: bridge
