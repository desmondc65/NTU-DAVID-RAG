# Unified RAG + GraphRAG stack
# -----------------------------------------------------------------------------
# One embedding-server container owns the GPU and hosts the gte-Qwen2-7B
# embedder + bge-reranker-v2-m3 once. rag-web and graphrag-web are CPU-only
# Flask backends that delegate all embedding / reranking over HTTP, so both
# services can run simultaneously against the same GPU.
#
# An nginx proxy exposes both under a single external port:
#   http://<host>:${UNIFIED_PORT:-3006}/            → landing + tab shell
#   http://<host>:${UNIFIED_PORT:-3006}/rag/        → vector RAG UI
#   http://<host>:${UNIFIED_PORT:-3006}/graph/      → GraphRAG UI
#
# Databases remain isolated exactly as before:
#   rag-web       → ../db        +  ../data
#   graphrag-web  → ../graph_db  +  ../graph_data
#
# The per-service compose files in RAG/ and graphRag/ are still usable for
# running a single service in isolation; they load their own embedder and
# do not share this stack.
services:

  embedding-server:
    build:
      context: ./embedding_server
      dockerfile: Dockerfile
    container_name: embedding-server
    restart: unless-stopped
    environment:
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "${EMBEDDING_GPU:-1}"
      EMBEDDING_DEVICE: "cuda:0"
      RERANKER_DEVICE: "cuda:0"
      EMBEDDING_MODEL: "${EMBEDDING_MODEL:-Alibaba-NLP/gte-Qwen2-7B-instruct}"
      RERANKER_MODEL: "${RERANKER_MODEL:-BAAI/bge-reranker-v2-m3}"
      EMBEDDING_BATCH_SIZE: "${EMBEDDING_BATCH_SIZE:-8}"
    volumes:
      # server.py imports utils.s2_embedding.embedder for prefix helpers.
      - ../utils:/app/utils:ro
      # Persist HF weights so subsequent restarts don't re-download.
      - ../hf_cache:/root/.cache/huggingface
    healthcheck:
      # Needs both models loaded before dependents can start. On a cold
      # HF cache the 7B download can take several minutes — start_period
      # gives a long grace window where failures don't count.
      test: ["CMD", "python", "-c", "import json,urllib.request,sys; d=json.loads(urllib.request.urlopen('http://localhost:8080/health',timeout=5).read()); sys.exit(0 if d.get('embedder_ready') and d.get('reranker_ready') else 1)"]
      interval: 15s
      timeout: 10s
      retries: 40
      start_period: 600s
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${EMBEDDING_GPU:-1}"]
              capabilities: [gpu]
    networks:
      - shared-net

  rag-web:
    build:
      context: ./RAG
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: "/rag/"
    container_name: rag-web
    restart: unless-stopped
    depends_on:
      embedding-server:
        condition: service_healthy
    env_file:
      - ./RAG/.env
    environment:
      # Remote-mode: both wrappers skip local model loads and route to the
      # shared embedding server. Retrieval/query is CPU-only here; the GPU
      # is only touched transiently by MinerU during PDF ingestion.
      RAG_EMBEDDING_SERVER_URL: "http://embedding-server:8080"
      RAG_RERANKER_SERVER_URL: "http://embedding-server:8080"
      RAG_DEVICE: "cpu"
      RAG_EMBEDDING_DEVICE: "cpu"
      RAG_RERANKER_DEVICE: "cpu"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "${EMBEDDING_GPU:-1}"
    volumes:
      - ../utils:/app/utils:ro
      - ../db:/app/db
      - ../data:/app/data
      - ../requirements.txt:/app/project_requirements.txt:ro
      - ./RAG/log.txt:/app/log.txt
      # Share the HF cache so MinerU's layout models are fetched once.
      - ../hf_cache:/root/.cache/huggingface
    command: >
      /bin/sh -c "gunicorn --bind 0.0.0.0:5000 --timeout 900 --workers 1 --threads 4 app:app 2>&1 | tee -a /app/log.txt"
    privileged: true
    deploy:
      # Share the same GPU the embedding server uses — MinerU runs only
      # during uploads and releases memory when done. The embedder's
      # 15 GB + MinerU's ~3 GB comfortably fits a 30 GB card.
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${EMBEDDING_GPU:-1}"]
              capabilities: [gpu]
    networks:
      - shared-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  graphrag-web:
    build:
      context: ./graphRag
      dockerfile: Dockerfile
      args:
        VITE_BASE_PATH: "/graph/"
    container_name: graphrag-web
    restart: unless-stopped
    depends_on:
      embedding-server:
        condition: service_healthy
    env_file:
      - ./graphRag/.env
    environment:
      RAG_EMBEDDING_SERVER_URL: "http://embedding-server:8080"
      RAG_RERANKER_SERVER_URL: "http://embedding-server:8080"
      RAG_DEVICE: "cpu"
      RAG_EMBEDDING_DEVICE: "cpu"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "${EMBEDDING_GPU:-1}"
    volumes:
      - ../utils:/app/utils:ro
      - ../graphRag:/app/graphRag:ro
      # GraphRAG keeps its OWN database — separate from docker/RAG.
      - ../graph_db:/app/db
      - ../graph_data:/app/data
      - ../requirements.txt:/app/project_requirements.txt:ro
      - ./graphRag/log.txt:/app/log.txt
      - ../hf_cache:/root/.cache/huggingface
    command: >
      /bin/sh -c "gunicorn --bind 0.0.0.0:5000 --timeout 1200 --workers 1 --threads 4 app:app 2>&1 | tee -a /app/log.txt"
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${EMBEDDING_GPU:-1}"]
              capabilities: [gpu]
    networks:
      - shared-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  proxy:
    image: nginx:1.27-alpine
    container_name: rag-proxy
    restart: unless-stopped
    depends_on:
      - rag-web
      - graphrag-web
    ports:
      - "${UNIFIED_PORT:-3006}:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy/html:/usr/share/nginx/html:ro
    networks:
      - shared-net

networks:
  shared-net:
    driver: bridge
