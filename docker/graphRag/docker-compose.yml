services:
  graphrag-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphrag-web
    restart: unless-stopped
    ports:
      - "${GRAPHRAG_PORT:-3007}:5000"
    env_file:
      - .env
    environment:
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "1"
      RAG_DEVICE: "cuda:0"
      RAG_EMBEDDING_DEVICE: "cuda:0"
    volumes:
      - ../../utils:/app/utils:ro
      - ../../graphRag:/app/graphRag:ro
      # GraphRAG maintains its OWN database — separate from docker/RAG.
      - ../../graph_db:/app/db
      - ../../graph_data:/app/data
      - ../../requirements.txt:/app/project_requirements.txt:ro
      - ./log.txt:/app/log.txt
      - ../../hf_cache:/root/.cache/huggingface
    command: >
      /bin/sh -c "gunicorn --bind 0.0.0.0:5000 --timeout 1200 --workers 1 --threads 4 app:app 2>&1 | tee -a /app/log.txt"
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    networks:
      - graphrag-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  graphrag-web-dev:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: graphrag-web-dev
    profiles: ["dev"]
    ports:
      - "${GRAPHRAG_PORT:-3007}:5000"
    env_file:
      - .env
    environment:
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "1"
      RAG_DEVICE: "cuda:0"
      RAG_EMBEDDING_DEVICE: "cuda:0"
    volumes:
      - ./app.py:/app/app.py
      - ../../utils:/app/utils:ro
      - ../../graphRag:/app/graphRag:ro
      # GraphRAG maintains its OWN database — separate from docker/RAG.
      - ../../graph_db:/app/db
      - ../../graph_data:/app/data
      - ../../requirements.txt:/app/project_requirements.txt:ro
      - ./log.txt:/app/log.txt
      - ../../hf_cache:/root/.cache/huggingface
    command: >
      /bin/sh -c "python app.py 2>&1 | tee -a /app/log.txt"
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    networks:
      - graphrag-net
    extra_hosts:
      - "host.docker.internal:host-gateway"

  graphrag-frontend-dev:
    image: node:20-slim
    container_name: graphrag-frontend-dev
    profiles: ["dev"]
    working_dir: /frontend
    depends_on:
      - graphrag-web-dev
    ports:
      - "5174:5173"
    environment:
      VITE_API_PROXY_TARGET: http://graphrag-web-dev:5000
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/frontend
    command: >
      /bin/sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5173"
    networks:
      - graphrag-net

networks:
  graphrag-net:
    driver: bridge
