services:
  gemma4-31b-server:
    build:
      context: ./gemma_server
      dockerfile: Dockerfile
    container_name: gemma4-31b-server
    restart: unless-stopped
    gpus: all

    ports:
      - "${GEMMA_SERVICE_PORT:-8086}:8086"

    environment:
      NVIDIA_VISIBLE_DEVICES: "${GEMMA_NVIDIA_VISIBLE_DEVICES:-2}"
      CUDA_VISIBLE_DEVICES: "${GEMMA_CUDA_VISIBLE_DEVICES:-2}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      HF_HOME: /hf-cache
      HUGGING_FACE_HUB_TOKEN: "${HUGGING_FACE_HUB_TOKEN:-}"
      GEMMA_MODEL_ID: "${GEMMA_MODEL_ID:-google/gemma-4-31b-it}"
      GEMMA_MODEL_ALIAS: "${GEMMA_MODEL_ALIAS:-gemma4-31b-it}"
      GEMMA_DTYPE: "${GEMMA_DTYPE:-bfloat16}"
      GEMMA_MAX_NEW_TOKENS: "${GEMMA_MAX_NEW_TOKENS:-512}"
      LOCAL_LLM_API_KEY: "${LOCAL_LLM_API_KEY:-local-dev-key}"

    volumes:
      - "${HF_CACHE_DIR:-/home3/davidlcs/Econ-Rag/Models/hf-cache}:/hf-cache"
      - "/home3/davidlcs/Econ-Rag/NTU-DAVID-RAG/docker/local_llm:/logs"

    command: >
      /bin/bash -lc "
      uvicorn app:app --host 0.0.0.0 --port 8086 2>&1 | tee /logs/log.txt;
      exit $${PIPESTATUS[0]}
      "

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
