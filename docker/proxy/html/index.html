<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NTU DAVID RAG</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0b0e17;
      overflow: hidden;
    }
    .frame {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #0b0e17;
      display: none;
    }
    .frame.active { display: block; }
  </style>
</head>
<body>
  <iframe id="frame-rag"   class="frame" title="RAG"      loading="lazy"></iframe>
  <iframe id="frame-graph" class="frame" title="GraphRAG" loading="lazy"></iframe>

  <script>
    (function () {
      const frames = {
        rag:   document.getElementById('frame-rag'),
        graph: document.getElementById('frame-graph'),
      };
      const urls = { rag: '/rag/', graph: '/graph/' };
      const loaded = { rag: false, graph: false };

      function show(view) {
        if (view !== 'rag' && view !== 'graph') view = 'graph';
        if (!loaded[view]) {
          frames[view].src = urls[view];
          loaded[view] = true;
        }
        frames.rag.classList.toggle('active', view === 'rag');
        frames.graph.classList.toggle('active', view === 'graph');
        if (window.location.hash !== '#' + view) {
          history.replaceState(null, '', '#' + view);
        }
      }

      window.addEventListener('hashchange', () => {
        show((window.location.hash || '').replace('#', ''));
      });

      const initial = (window.location.hash || '').replace('#', '');
      show(['rag', 'graph'].includes(initial) ? initial : 'graph');
    })();
  </script>
</body>
</html>
