worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Paper uploads can be dozens of MB — lift the default 1M cap.
    client_max_body_size 512m;

    # RAG / GraphRAG queries can take a long time on cold LLMs.
    proxy_connect_timeout 60s;
    proxy_send_timeout    1200s;
    proxy_read_timeout    1200s;

    # Upstreams
    upstream rag_backend {
        server rag-web:5000;
    }
    upstream graph_backend {
        server graphrag-web:5000;
    }

    server {
        listen 80;
        server_name _;

        # Security headers applied to every response. Keep CSP relatively
        # permissive for now — the SPAs use inline styles and data: images.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # 'unsafe-inline' on script-src is needed by the shell page's inline
        # iframe-router script and by dev-time SPA helpers. The SPA bundles
        # are emitted by Vite as external files, so this does not weaken
        # their protection. frame-src 'self' lets the root shell embed the
        # per-service apps under /rag/ and /graph/ in iframes.
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self'" always;

        # ── Landing / shell page ────────────────────────────────────────
        # Serves the unified dashboard at '/'.
        root /usr/share/nginx/html;
        index index.html;

        location = / {
            # Re-declare the security headers because nginx's `add_header`
            # does not inherit into a child location once the child
            # declares its own. Also add Cache-Control: no-store so the
            # shell page always reflects the current CSP / asset hashes
            # — the inline script makes stale HTML especially painful.
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-src 'self'" always;
            add_header Cache-Control "no-store" always;
            try_files /index.html =404;
        }

        # ── Shared auth endpoints ───────────────────────────────────────
        # Routed to rag-web (the auth code is shared, either backend would
        # work — routing to one keeps the login URL canonical). The session
        # cookie is set with Path=/ so it reaches both /rag/ and /graph/.
        location /api/auth/ {
            proxy_pass http://rag_backend/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # ── RAG (vector) ────────────────────────────────────────────────
        # The frontend is built with VITE_BASE_PATH='/rag/', so all asset
        # URLs already include the prefix. nginx strips it before handing
        # the request to the Flask app, which itself serves at '/'.
        location /rag/ {
            proxy_pass http://rag_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /rag;
            proxy_buffering off;
        }

        # ── GraphRAG (graph) ────────────────────────────────────────────
        location /graph/ {
            proxy_pass http://graph_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /graph;
            proxy_buffering off;
        }

        # Bare '/rag' and '/graph' (no trailing slash) → redirect to the
        # slashed form so the static asset URLs resolve correctly.
        location = /rag   { return 301 /rag/; }
        location = /graph { return 301 /graph/; }

        # Fallback for anything else at the root — serve the landing SPA.
        location / {
            try_files $uri /index.html;
        }
    }
}
