worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Paper uploads can be dozens of MB — lift the default 1M cap.
    client_max_body_size 512m;

    # RAG queries can take a long time on cold LLMs. Paper ingestion is fully
    # synchronous (MinerU + per-unit Fortran digestion + profile) and can
    # exceed 20 min on a small shared-GPU LLM — allow up to 1h.
    proxy_connect_timeout 60s;
    proxy_send_timeout    3600s;
    proxy_read_timeout    3600s;

    upstream rag_backend {
        server rag-web:5000;
    }

    server {
        listen 80;
        server_name _;

        # Keep Location: headers as relative paths so SSH-forwarded
        # clients (e.g. ssh -L 3006:localhost:3006) follow redirects
        # back to the same forwarded port instead of bare port 80.
        absolute_redirect off;

        # Security headers applied to every response. Keep CSP relatively
        # permissive for now — the SPA uses inline styles and data: images.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'" always;

        # ── Shared auth endpoints ───────────────────────────────────────
        location /api/auth/ {
            proxy_pass http://rag_backend/api/auth/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
        }

        # ── RAG (vector) ────────────────────────────────────────────────
        # The frontend is built with VITE_BASE_PATH='/rag/', so all asset
        # URLs already include the prefix. nginx strips it before handing
        # the request to the Flask app, which itself serves at '/'.
        location /rag/ {
            proxy_pass http://rag_backend/;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /rag;
            proxy_buffering off;
        }

        # Bare '/rag' (no trailing slash) and the root both land on the SPA.
        location = /rag { return 301 /rag/; }
        location = /    { return 301 /rag/; }
    }
}
